name: pages

# docs(링크 페이지·카드)가 바뀌어 push되면 바로 GitHub Pages에 반영합니다. 쿠팡 API는 부르지 않습니다.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
