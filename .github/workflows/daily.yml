name: daily-cardnews

on:
  schedule:
    # 매일 17:17 (한국 시간). 실제 시작은 보통 40분쯤 늦습니다. 게시는 publish.yml이 다음 날 12:40에 합니다.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-cardnews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate cards
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          CARD_ACCENT: ${{ vars.CARD_ACCENT || '#FFD43B' }}
        run: python -m src.main generate
      - name: Commit
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Vol 카드뉴스 자동 생성 $(date +%F)" || echo "변경 없음"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
